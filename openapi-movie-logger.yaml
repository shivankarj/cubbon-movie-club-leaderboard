openapi: 3.1.0
info:
  title: Cubbon Movie Club Movie Lookup (Dry Run)
  version: 0.2.0
  description: Preview movie metadata and estimated points only. This test endpoint never saves or publishes a review.
servers:
  - url: https://YOUR-VERCEL-PREVIEW-URL
paths:
  /api/movie-logs:
    post:
      operationId: previewMovieReview
      summary: Preview a movie review (no save)
      description: Looks up movie details and estimates eligible scoring bonuses. This dry-run endpoint never saves or publishes anything.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - memberName
                - imdbUrl
                - review
              properties:
                memberName:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Club member name exactly as it should appear in the log.
                imdbUrl:
                  type: string
                  format: uri
                  description: IMDb title URL, such as https://www.imdb.com/title/tt0073747/.
                review:
                  type: string
                  maxLength: 5000
                  description: Review text to publish.
      responses:
        "200":
          description: Movie details and estimated points returned. No movie log is saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dryRun:
                    type: boolean
                  saved:
                    type: boolean
                  movie:
                    type: string
                  memberName:
                    type: string
                  points:
                    type: integer
                  bonuses:
                    type: array
                    items:
                      type: string
        "400":
          description: Invalid request.
        "401":
          description: Missing or invalid API key.
        "404":
          description: IMDb title could not be matched to a movie.
        "409":
          description: This IMDb title is already in the film log.
        "500":
          description: Server configuration or publishing error.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
